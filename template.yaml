AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Entra access token exchange Lambda (validate incoming JWT, return original token)

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
    MemorySize: 256

Parameters:
  EntraTenantId:
    Type: String
    Description: Azure Entra tenant ID (GUID)
  EntraAudience:
    Type: String
    Description: Expected audience (aud) in incoming Entra access token
  EntraIssuer:
    Type: String
    Description: Expected issuer (iss)
  AllowedSourceCidrs:
    Type: String
    Default: "0.0.0.0/0"
    AllowedPattern: "^\\d{1,3}(\\.\\d{1,3}){3}/\\d{1,2}(,\\d{1,3}(\\.\\d{1,3}){3}/\\d{1,2})*$"
    ConstraintDescription: Comma-separated IPv4 CIDRs with no spaces, e.g. 203.0.113.10/32,203.0.113.11/32
    Description: >-
      Comma-separated IPv4 CIDRs (no spaces) allowed to call the token endpoint,
      e.g. your Superblocks data plane NAT egress IPs as /32s. Requests from any
      other source IP get a 403 from API Gateway. 0.0.0.0/0 allows all.
  ThrottlingRateLimit:
    Type: Number
    Default: 50
    Description: Steady-state requests per second allowed on the API stage
  ThrottlingBurstLimit:
    Type: Number
    Default: 100
    Description: Burst request limit on the API stage

Resources:
  TokenApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      EndpointConfiguration:
        Type: REGIONAL
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: !Ref ThrottlingRateLimit
          ThrottlingBurstLimit: !Ref ThrottlingBurstLimit
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'authorization,content-type'"
        AllowMethods: "'OPTIONS,POST'"
      Auth:
        ResourcePolicy:
          CustomStatements:
            - Effect: Allow
              Principal: "*"
              Action: execute-api:Invoke
              Resource: execute-api:/*
            - Effect: Deny
              Principal: "*"
              Action: execute-api:Invoke
              Resource: execute-api:/*
              Condition:
                NotIpAddress:
                  aws:SourceIp: !Split [",", !Ref AllowedSourceCidrs]

  TokenExchangeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      CodeUri: .
      Handler: src/handler.handler
      Environment:
        Variables:
          ENTRA_TENANT_ID: !Ref EntraTenantId
          ENTRA_AUDIENCE: !Ref EntraAudience
          CORS_ORIGIN: "*"

          # Optional:
          ENTRA_ISSUER: !Ref EntraIssuer
          # REQUIRED_SCOPE: "read write"
      Events:
        Exchange:
          Type: Api
          Properties:
            RestApiId: !Ref TokenApi
            Path: /oauth2/token
            Method: POST
    Metadata:
      BuildMethod: nodejs24.x

Outputs:
  TokenEndpoint:
    Description: Token exchange endpoint
    Value: !Sub "https://${TokenApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/oauth2/token"
